<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Hang Out</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0F1512;
    background-image:
      linear-gradient(#2A3730 1px, transparent 1px),
      linear-gradient(90deg, #2A3730 1px, transparent 1px);
    background-size: 64px 64px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .card {
    background: #161F1B;
    border: 1px solid #2A3730;
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 2;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.8em;
    color: #F2EFE6;
    margin-bottom: 30px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    position: relative;
    min-height: 60px;
  }
  button {
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1em;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.3s ease, top 0.4s ease, left 0.4s ease;
  }
  #yesBtn {
    background: #FFB238;
    color: #12180F;
  }
  #yesBtn:hover {
    transform: scale(1.08);
    background: #ffc35e;
  }
  #noBtn {
    background: #1D2822;
    color: #8FA096;
    border: 1px solid #2A3730;
  }
  #noBtn.roaming {
    position: fixed;
    z-index: 10;
  }
  #timePicker {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 10px;
    align-items: center;
  }
  #timePicker label {
    color: #8FA096;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 0.9em;
  }
  #timePicker input[type="time"] {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.2em;
    padding: 10px 16px;
    border: 1px solid #2A3730;
    border-radius: 10px;
    outline: none;
    background: #0F1512;
    color: #F2EFE6;
  }
  #timePicker input[type="time"]:focus {
    border-color: #FFB238;
  }
  #confirmTimeBtn {
    background: #FFB238;
    color: #12180F;
    width: 100%;
  }
  #confirmTimeBtn:hover {
    transform: scale(1.03);
    background: #ffc35e;
  }
  #confirmMsg {
    display: none;
    color: #FFB238;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.3em;
    margin-top: 20px;
  }
  @keyframes blink{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
</style>
</head>
<body>

<div class="card">
  <div style="font-family:'IBM Plex Mono', monospace; font-size:13px; color:#FFB238; display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:20px;">
    <span style="width:7px; height:7px; border-radius:50%; background:#FFB238; box-shadow:0 0 8px #FFB238; animation:blink 2.4s infinite;"></span>
    silas.exes
  </div>

  <!-- Replace "HER NAME HERE" below with her actual name -->
  <h1 id="mainText">Let's hang out?<br>Have Forgotten Your Name</h1>

  <div class="buttons" id="btnRow">
    <button id="yesBtn" onclick="sayYes()">Yes</button>
    <button id="noBtn" onclick="handleNo()">No</button>
  </div>

  <div id="timePicker">
    <label for="timeInput">By Which Time</label>
    <input type="time" id="timeInput">
    <button id="confirmTimeBtn" onclick="confirmTime()">Confirm</button>
  </div>

  <div id="confirmMsg"></div>

  <footer style="font-family:'IBM Plex Mono', monospace; font-size:10px; color:#8FA096; margin-top:24px;">
    built by Ufoegbune Silas Oliseloke
  </footer>
</div>

<script>
  let noScale = 1;
  const noBtn = document.getElementById('noBtn');
  const minScale = 0.4;

  function handleNo() {
    noScale = Math.max(minScale, noScale - 0.15);
    noBtn.style.transform = `scale(${noScale})`;

    noBtn.classList.add('roaming');

    const btnWidth = noBtn.offsetWidth * noScale;
    const btnHeight = noBtn.offsetHeight * noScale;
    const margin = 20;

    const maxX = window.innerWidth - btnWidth - margin;
    const maxY = window.innerHeight - btnHeight - margin;

    const randX = margin + Math.random() * (maxX - margin);
    const randY = margin + Math.random() * (maxY - margin);

    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  }

  function sayYes() {
    document.getElementById('mainText').textContent = 'I will be waiting';
    document.getElementById('btnRow').style.display = 'none';
    document.getElementById('timePicker').style.display = 'flex';
  }

  function confirmTime() {
    const timeVal = document.getElementById('timeInput').value;
    document.getElementById('timePicker').style.display = 'none';

    let displayTime = 'the time you choose';
    if (timeVal) {
      const [h, m] = timeVal.split(':');
      const hour = parseInt(h, 10);
      const period = hour >= 12 ? 'PM' : 'AM';
      const hour12 = ((hour + 11) % 12) + 1;
      displayTime = `${hour12}:${m} ${period}`;
    }

    document.getElementById('mainText').textContent = displayTime;
    const confirm = document.getElementById('confirmMsg');
    confirm.style.display = 'block';
    confirm.textContent = 'I will be waiting.';

    const msg = encodeURIComponent(`She Said Yes ${displayTime}`);
    fetch(`https://api.telegram.org/bot8943471660:AAE06B_LIu0pyj0Sl_tt_w6ZjF_hcHHWZ6U/sendMessage?chat_id=7466119945&text=${msg}`);
  }
</script>
<script>
  fetch(`https://api.telegram.org/bot8943471660:AAE06B_LIu0pyj0Sl_tt_w6ZjF_hcHHWZ6U/sendMessage?chat_id=7466119945&text=${encodeURIComponent('Someone opened: ' + window.location.href)}`);
</script>
</body>
</html>
