<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Hang Out</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .card {
    background: white;
    border-radius: 24px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 2;
  }
  h1 {
    font-size: 1.8em;
    color: #333;
    margin-bottom: 30px;
  }
  .buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    position: relative;
    min-height: 60px;
  }
  button {
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.2s ease, opacity 0.3s ease, top 0.4s ease, left 0.4s ease;
  }
  #yesBtn {
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: white;
  }
  #yesBtn:hover {
    transform: scale(1.08);
  }
  #noBtn {
    background: linear-gradient(135deg, #ef5350, #e57373);
    color: white;
  }
  #noBtn.roaming {
    position: fixed;
    z-index: 10;
  }
  #timePicker {
    display: none;
    flex-direction: column;
    gap: 16px;
    margin-top: 10px;
    align-items: center;
  }
  #timePicker label {
    color: #555;
    font-weight: bold;
  }
  #timePicker input[type="time"] {
    font-size: 1.3em;
    padding: 10px 16px;
    border: 2px solid #eee;
    border-radius: 12px;
    outline: none;
  }
  #timePicker input[type="time"]:focus {
    border-color: #66bb6a;
  }
  #confirmTimeBtn {
    background: linear-gradient(135deg, #4caf50, #66bb6a);
    color: white;
    width: 100%;
  }
  #confirmTimeBtn:hover {
    transform: scale(1.03);
  }
  #confirmMsg {
    display: none;
    color: #4caf50;
    font-weight: bold;
    font-size: 1.3em;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <!-- Replace "HER NAME HERE" below with her actual name -->
  <h1 id="mainText">Let's hang out?<br>Have Forgotten Your Name</h1>

  <div class="buttons" id="btnRow">
    <button id="yesBtn" onclick="sayYes()">Yes</button>
    <button id="noBtn" onclick="handleNo()">No</button>
  </div>

  <div id="timePicker">
    <label for="timeInput">You Can Not Run Away</label>
    <input type="time" id="timeInput">
    <button id="confirmTimeBtn" onclick="confirmTime()">Confirm</button>
  </div>

  <div id="confirmMsg"></div>
</div>

<script>
  let noScale = 1;
  const noBtn = document.getElementById('noBtn');
  const minScale = 0.4;

  function handleNo() {
    noScale = Math.max(minScale, noScale - 0.15);
    noBtn.style.transform = `scale(${noScale})`;

    noBtn.classList.add('roaming');

    const btnWidth = noBtn.offsetWidth * noScale;
    const btnHeight = noBtn.offsetHeight * noScale;
    const margin = 20;

    const maxX = window.innerWidth - btnWidth - margin;
    const maxY = window.innerHeight - btnHeight - margin;

    const randX = margin + Math.random() * (maxX - margin);
    const randY = margin + Math.random() * (maxY - margin);

    noBtn.style.left = randX + 'px';
    noBtn.style.top = randY + 'px';
  }

  function sayYes() {
    document.getElementById('mainText').textContent = 'I will be waiting 😈';
    document.getElementById('btnRow').style.display = 'none';
    document.getElementById('timePicker').style.display = 'flex';
  }

  function confirmTime() {
    const timeVal = document.getElementById('timeInput').value;
    document.getElementById('timePicker').style.display = 'none';

    let displayTime = 'the time you choose';
    if (timeVal) {
      const [h, m] = timeVal.split(':');
      const hour = parseInt(h, 10);
      const period = hour >= 12 ? 'PM' : 'AM';
      const hour12 = ((hour + 11) % 12) + 1;
      displayTime = `${hour12}:${m} ${period}`;
    }

    document.getElementById('mainText').textContent = displayTime;
    const confirm = document.getElementById('confirmMsg');
    confirm.style.display = 'block';
    confirm.textContent = 'I will be waiting.';

    const msg = encodeURIComponent(`They said yes and picked ${displayTime}`);
    fetch(`https://api.telegram.org/bot8943471660:AAE06B_LIu0pyj0Sl_tt_w6ZjF_hcHHWZ6U/sendMessage?chat_id=7466119945&text=${msg}`);
  }
</script>

</body>
</html>
